<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categories — BuyO</title>

  <!-- Favicon -->
  <link rel="icon" href="assets/icons/favicon.png" type="image/png" />

  <!-- BuyO design system -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#064E4A" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div data-buyo-header></div>

  <main id="main" class="buyo-page">
    <div class="buyo-container">
      <h1 class="results-title" id="page-title">Shop by category</h1>

      <!-- Real categories from GET /api/categories (hidden when none exist). -->
      <nav class="ui-chips" id="category-chips" aria-label="Product categories"
           style="margin-top: var(--space-5); margin-bottom: var(--space-8);"></nav>

      <section aria-label="Products">
        <div class="results-head">
          <h2 class="ui-section-title" id="results-heading">All products</h2>
          <p class="results-count" id="results-count" aria-live="polite"></p>
        </div>
        <div class="ui-product-grid" id="results"></div>
      </section>
    </div>
  </main>

  <div data-buyo-footer></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/categories.js"></script>
</body>
</html>
