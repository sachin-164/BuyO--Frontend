<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — BuyO</title>

  <!-- Favicon -->
  <link rel="icon" href="assets/icons/favicon.png" type="image/png" />

  <!-- BuyO design system -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#064E4A" />
</head>
<body>
  <main id="main" class="buyo-container ui-auth">

    <!-- Mirror of design-references/login.png (no dedicated signup screenshot
         exists — reported as a deviation). Same centered column, heavy title,
         labeled inputs, full-width dark button, sign-in footer. -->
    <a class="ui-auth__back" href="index.html"><span aria-hidden="true">←</span> Back to store</a>

    <h1 class="ui-auth__title">Create account</h1>
    <p class="ui-auth__sub">Join BuyO — your cart and orders follow your account.</p>

    <div class="ui-form-alert" id="signup-alert" role="alert" hidden></div>

    <form id="signupForm" action="login.html" method="get">
      <div class="ui-field">
        <label class="ui-label" for="signup-name">Full name</label>
        <input class="ui-input" id="signup-name" name="name" type="text"
               autocomplete="name" placeholder="Your name" maxlength="100" required />
      </div>

      <div class="ui-field">
        <label class="ui-label" for="signup-email">Email</label>
        <input class="ui-input" id="signup-email" name="email" type="email"
               autocomplete="email" placeholder="you@example.com" required />
      </div>

      <div class="ui-field">
        <label class="ui-label" for="signup-password">Password</label>
        <div class="ui-input-wrap">
          <input class="ui-input" id="signup-password" name="password" type="password"
                 autocomplete="new-password" placeholder="At least 8 characters"
                 minlength="8" maxlength="72" required
                 aria-describedby="signup-password-hint" />
          <button class="ui-input-toggle" type="button" id="signup-password-toggle"
                  aria-label="Show password" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="ui-error" id="signup-password-hint" style="color: var(--color-text-muted);">
          8–72 characters.
        </p>
      </div>

      <div class="ui-field">
        <label class="ui-label" for="signup-confirm">Confirm password</label>
        <input class="ui-input" id="signup-confirm" name="confirm" type="password"
               autocomplete="new-password" placeholder="Repeat your password"
               minlength="8" maxlength="72" required />
        <p class="ui-error" id="signup-confirm-error" hidden></p>
      </div>

      <button class="ui-btn ui-btn--primary ui-btn--block" type="submit" id="signup-submit">
        Create account
      </button>
    </form>

    <p class="ui-auth__foot">
      Already have an account? <a href="login.html">Sign in</a>
    </p>

  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
