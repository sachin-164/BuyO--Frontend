<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Orders · BuyO Admin</title>
  <link rel="icon" href="../assets/icons/favicon.png" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="adm">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="adm-app" data-adm-shell data-page="orders" data-title="Orders">
    <div data-adm-side></div>
    <div class="adm-col">
      <div data-adm-top></div>
      <main class="adm-main" id="main" tabindex="-1">
        <section class="adm-card" aria-labelledby="orders-title">
          <div class="adm-card__head">
            <h2 class="adm-card__title" id="orders-title">Orders</h2>
            <p class="adm-card__subtitle" data-count aria-live="polite">Loading orders…</p>
          </div>

          <!-- Server-validated status filter (GET /api/admin/orders?status=) -->
          <div class="adm-filter-chips" role="group" aria-label="Filter orders by status">
            <button type="button" class="adm-filter-chip" data-status="" aria-pressed="true">All</button>
            <button type="button" class="adm-filter-chip" data-status="placed" aria-pressed="false">Placed</button>
            <button type="button" class="adm-filter-chip" data-status="confirmed" aria-pressed="false">Confirmed</button>
            <button type="button" class="adm-filter-chip" data-status="shipped" aria-pressed="false">Shipped</button>
            <button type="button" class="adm-filter-chip" data-status="delivered" aria-pressed="false">Delivered</button>
            <button type="button" class="adm-filter-chip" data-status="cancelled" aria-pressed="false">Cancelled</button>
          </div>

          <div data-table></div>
          <div data-pager></div>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/catalog.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
