<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Dashboard · BuyO Admin</title>
  <link rel="icon" href="../assets/icons/favicon.png" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="adm">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="adm-app" data-adm-shell data-page="dashboard" data-title="Dashboard">
    <div data-adm-side></div>
    <div class="adm-col">
      <div data-adm-top></div>
      <main class="adm-main" id="main" tabindex="-1">
        <!-- Statistics: rendered exclusively from live API data (no presets). -->
        <div class="adm-stats" data-stats aria-live="polite"></div>

        <section class="adm-card" aria-labelledby="recent-orders-title">
          <div class="adm-card__head">
            <h2 class="adm-card__title" id="recent-orders-title">Recent orders</h2>
            <div class="adm-card__head-actions">
              <a class="ui-btn ui-btn--secondary ui-btn--sm" href="orders.html">View all orders</a>
            </div>
          </div>
          <div data-recent></div>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/catalog.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
