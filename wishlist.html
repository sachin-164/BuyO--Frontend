<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wishlist — BuyO</title>

  <!-- Favicon -->
  <link rel="icon" href="assets/icons/favicon.png" type="image/png" />

  <!-- BuyO design system -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#064E4A" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div data-buyo-header></div>

  <main id="main" class="buyo-page">
    <div class="buyo-container">

      <!-- No dedicated wishlist screenshot exists in design-references/ — this
           page follows BuyO's product-card system (Home_page cards) on the
           shared shell; reported as a deviation in the Phase 9 report. -->
      <div class="results-head">
        <h1 class="results-title">Wishlist</h1>
        <p class="results-count" id="wishlist-count" aria-live="polite"></p>
      </div>

      <!-- Signed-out state. -->
      <div id="wishlist-guest" hidden>
        <div class="ui-empty">
          <span class="ui-empty__icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.4-7 10-7 10Z"/></svg>
          </span>
          <h2 class="ui-empty__title">Sign in to see your wishlist</h2>
          <p class="ui-empty__text">Saved items live on your account, so they're waiting wherever you sign in.</p>
          <div style="display: flex; gap: var(--space-3); flex-wrap: wrap; justify-content: center;">
            <a class="ui-btn ui-btn--primary" href="login.html?next=wishlist.html">Sign in</a>
            <a class="ui-btn ui-btn--secondary" href="signup.html">Create account</a>
          </div>
        </div>
      </div>

      <!-- Loaded state: product cards + per-item Remove. -->
      <div class="ui-product-grid" id="wishlist-grid" hidden></div>

    </div>
  </main>

  <div data-buyo-footer></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/wishlist.js"></script>
</body>
</html>
