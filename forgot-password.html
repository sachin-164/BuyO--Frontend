<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password — BuyO</title>

  <link rel="icon" href="assets/icons/favicon.png" type="image/png" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />

  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#064E4A" />
</head>
<body>
  <main id="main" class="buyo-container ui-auth">
    <a class="ui-auth__back" href="login.html"><span aria-hidden="true">←</span> Back to sign in</a>

    <h1 class="ui-auth__title">Forgot password</h1>
    <p class="ui-auth__sub">
      Enter your account email and we'll send a reset link.
    </p>

    <div class="ui-form-alert" id="forgot-alert" role="alert" hidden></div>

    <form id="forgotForm" action="login.html" method="get">
      <div class="ui-field">
        <label class="ui-label" for="forgot-email">Email</label>
        <input class="ui-input" id="forgot-email" name="email" type="email"
               autocomplete="email" placeholder="you@example.com" required />
      </div>

      <button class="ui-btn ui-btn--primary ui-btn--block" type="submit" id="forgot-submit">
        Send reset link
      </button>
    </form>

    <p class="ui-auth__foot">
      Remembered it? <a href="login.html">Sign in</a>
    </p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
