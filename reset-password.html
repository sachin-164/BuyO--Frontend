<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — BuyO</title>

  <link rel="icon" href="assets/icons/favicon.png" type="image/png" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />

  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#064E4A" />
</head>
<body>
  <main id="main" class="buyo-container ui-auth">
    <a class="ui-auth__back" href="login.html"><span aria-hidden="true">←</span> Back to sign in</a>

    <h1 class="ui-auth__title">Set new password</h1>
    <p class="ui-auth__sub">Choose a new password for your BuyO account.</p>

    <div class="ui-form-alert" id="reset-alert" role="alert" hidden></div>

    <form id="resetForm" action="login.html" method="get">
      <div class="ui-field">
        <label class="ui-label" for="reset-password">New password</label>
        <div class="ui-input-wrap">
          <input class="ui-input" id="reset-password" name="password" type="password"
                 autocomplete="new-password" placeholder="At least 8 characters"
                 minlength="8" maxlength="72" required />
          <button class="ui-input-toggle" type="button" id="reset-password-toggle"
                  aria-label="Show password" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="ui-field">
        <label class="ui-label" for="reset-confirm">Confirm new password</label>
        <input class="ui-input" id="reset-confirm" name="confirm" type="password"
               autocomplete="new-password" placeholder="Repeat the password"
               minlength="8" maxlength="72" required />
        <p class="ui-error" id="reset-confirm-error" hidden></p>
      </div>

      <button class="ui-btn ui-btn--primary ui-btn--block" type="submit" id="reset-submit">
        Save new password
      </button>
    </form>

    <p class="ui-auth__foot">
      Need a new link? <a href="forgot-password.html">Request reset</a>
    </p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
