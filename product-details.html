<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product — BuyO</title>

  <!-- Favicon -->
  <link rel="icon" href="assets/icons/favicon.png" type="image/png" />

  <!-- BuyO design system -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#064E4A" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div data-buyo-header></div>

  <main id="main" class="buyo-page">
    <div class="buyo-container">

      <nav class="ui-breadcrumb" aria-label="Breadcrumb" id="breadcrumb" hidden>
        <a href="index.html">Home</a>
        <span aria-hidden="true">/</span>
        <a href="products.html">Products</a>
        <span aria-hidden="true" id="breadcrumb-sep" hidden>/</span>
        <a href="#" id="breadcrumb-category" hidden></a>
      </nav>

      <!-- Loading / error / not-found state replaces the whole detail block. -->
      <div id="detail-status" hidden></div>

      <!-- Loaded product (hidden until GET /api/products/:identifier succeeds). -->
      <article class="ui-detail" id="detail" hidden>
        <div class="ui-detail__media" id="detail-media"></div>

        <div>
          <a class="ui-detail__category" id="detail-category" href="categories.html"></a>
          <h1 class="ui-detail__name" id="detail-name"></h1>

          <div class="ui-detail__price-row">
            <span class="ui-detail__price" id="detail-price"></span>
            <span class="ui-detail__mrp" id="detail-mrp" hidden></span>
          </div>

          <div class="ui-detail__stock" id="detail-stock"></div>

          <p class="ui-detail__description" id="detail-description"></p>

          <div class="ui-detail__actions">
            <button class="ui-btn ui-btn--primary" type="button" id="add-to-cart">
              Add to cart
            </button>
            <button class="ui-btn ui-btn--secondary" type="button" id="add-to-wishlist">
              Add to wishlist
            </button>
          </div>

          <!-- Honest sign-in prompt shown when there is no session. -->
          <p class="ui-detail__auth-note" id="auth-note" hidden>
            <a href="login.html">Sign in</a> to add items to your cart or
            wishlist.
          </p>
        </div>
      </article>

    </div>
  </main>

  <div data-buyo-footer></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/product-details.js"></script>
</body>
</html>
